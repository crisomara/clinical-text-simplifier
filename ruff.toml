target-version = "py311"
line-length = 120
# src/ scripts import each other as top-level modules (e.g. `from prompting import ...`).
src = [".", "src"]

[lint]
# pycodestyle errors/warnings, pyflakes, import sorting, bugbear.
select = ["E", "W", "F", "I", "B"]
# E501: the formatter owns line length; long CSS/HTML strings in the app are deliberate.
ignore = ["E501"]
