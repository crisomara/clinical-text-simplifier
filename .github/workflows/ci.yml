name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: ruff check
        run: ruff check --output-format=github .
      - name: ruff format --check
        run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Belt and braces: tests must never pull the ~1GB base model from the Hub.
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      # requirements.txt points pip at the CPU-only torch wheel index.
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  # The Dockerfile bakes the ~1GB Qwen2.5-0.5B-Instruct weights into the image at
  # build time, so `docker build` is deliberately not run in CI (no model weight
  # downloads in CI). This job boots the same Streamlit entrypoint the image runs;
  # the model only loads when a user clicks "Simplify", so no weights are fetched.
  app-boot:
    name: App boot check (Streamlit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Start the app and check its health endpoint
        run: |
          streamlit run app/streamlit_app.py --server.headless true --server.port 8501 --server.fileWatcherType none > streamlit.log 2>&1 &
          for _ in $(seq 1 45); do
            if curl -fsS http://localhost:8501/_stcore/health; then
              echo
              echo "App server is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App server did not become healthy in time"
          cat streamlit.log
          exit 1
